<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Network Debug</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen eng-screen">
    <div class="eng-header">
      <a href="set_activity.html" style="display:flex;align-items:center;text-decoration:none;">
        <img src="img/ic_back.png" alt="Back" width="45" height="45" style="cursor:pointer;">
        <span class="eng-title">Wi-Fi diagnostics</span>
      </a>
    </div>
    <div class="eng-content">
      <div class="eng-info-row"><span>Wi-Fi</span><span id="wifiStatus">Connected</span></div>
      <div class="eng-info-row"><span>SSID</span><span>UnicornRF-AP</span></div>
      <div class="eng-info-row"><span>IP Address</span><span>192.168.1.100</span></div>
      <div class="eng-info-row"><span>Signal Strength</span><span id="signalStr">-45 dBm</span></div>
      <div class="eng-info-row"><span>4G</span><span>Disconnected</span></div>
      <div class="eng-info-row"><span>Network Connected</span><span style="color:#5bae00;">Yes</span></div>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button onclick="showToast('Scanning...')" style="padding:10px 25px;background:#10ae27;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Scan</button>
        <button onclick="showToast('Connecting...')" style="padding:10px 25px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Connect</button>
        <button onclick="showToast('Disconnected')" style="padding:10px 25px;background:#f41626;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Disconnect</button>
      </div>
    </div>
    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
