<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Handpiece Burn</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen eng-screen">
    <div class="eng-header">
      <a href="set_activity.html" style="display:flex;align-items:center;text-decoration:none;">
        <img src="img/ic_back.png" alt="Back" width="45" height="45" style="cursor:pointer;">
        <span class="eng-title">Handpiece Info</span>
      </a>
    </div>
    <div class="eng-content">
      <div style="margin-bottom:20px;">
        <label style="font-size:16px;color:#333;">Serial Number (SN): </label>
        <input type="text" id="snInput" placeholder="Enter SN" style="padding:8px 12px;font-size:16px;border:1px solid #ccc;border-radius:4px;width:300px;">
      </div>
      <div class="eng-info-row"><span>Handpiece ID</span><span id="hpId">N/A</span></div>
      <div class="eng-info-row"><span>Handpiece Type</span><span>MicroRF</span></div>
      <div class="eng-info-row"><span>Current SN</span><span id="currentSn">N/A</span></div>
      <div class="eng-info-row"><span>13-bit Tag Number</span><span id="tagNum">N/A</span></div>
      <div class="eng-info-row"><span>Burn Status</span><span id="burnStatus">Ready</span></div>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button id="btnRead" style="padding:10px 25px;background:#10ae27;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Read</button>
        <button id="btnBurn" style="padding:10px 25px;background:#ff5a00;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Burn</button>
        <button id="btnSave" style="padding:10px 25px;background:#5bae00;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Save</button>
        <button id="btnRest" style="padding:10px 25px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Reset</button>
      </div>
      <div id="burnProgress" class="hidden" style="margin-top:20px;padding:15px;background:#fff;border:1px solid #ccc;border-radius:8px;">
        <div style="font-size:14px;color:#888;margin-bottom:8px;">Burning...</div>
        <div style="width:100%;height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden;">
          <div id="burnBar" style="height:100%;background:#ff5a00;width:0%;transition:width 0.3s;"></div>
        </div>
      </div>
    </div>
    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('btnRead')?.addEventListener('click', () => {
    document.getElementById('hpId').textContent = 'HP-' + Math.floor(Math.random()*100000);
    document.getElementById('currentSn').textContent = document.getElementById('snInput').value || 'N/A';
    showToast('Handpiece read');
  });
  document.getElementById('btnBurn')?.addEventListener('click', () => {
    const prog = document.getElementById('burnProgress');
    const bar = document.getElementById('burnBar');
    const status = document.getElementById('burnStatus');
    prog.classList.remove('hidden');
    status.textContent = 'Burning...';
    let p = 0;
    const t = setInterval(() => {
      p += 10; bar.style.width = p + '%';
      if (p >= 100) { clearInterval(t); status.textContent = 'Done'; showToast('Burn complete'); }
    }, 200);
  });
  document.getElementById('btnSave')?.addEventListener('click', () => showToast('Saved'));
  document.getElementById('btnRest')?.addEventListener('click', () => {
    document.getElementById('snInput').value = '';
    document.getElementById('hpId').textContent = 'N/A';
    document.getElementById('currentSn').textContent = 'N/A';
    document.getElementById('burnStatus').textContent = 'Ready';
    document.getElementById('burnProgress').classList.add('hidden');
  });
</script>
</body>
</html>
