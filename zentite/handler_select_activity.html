<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Handpiece Select</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen bg-main">
    <!-- btn_back -->
    <a href="set_activity.html" class="btn-back" title="Back"></a>

    <!-- Title -->
    <div class="title-bar">
      <span class="text-cyan-title">Handpiece Selection</span>
    </div>

    <!-- Handpiece options -->
    <div style="position:absolute;top:200px;left:100px;right:100px;display:flex;flex-direction:column;gap:30px;">
      <div class="settings-card card-lang" style="position:relative;width:100%;height:120px;display:flex;align-items:center;padding:0 30px;background:url('img/bg_set.png') no-repeat left center;background-size:120px 120px;cursor:pointer;border:none;" onclick="showToast('MicroRF selected')">
        <div style="margin-left:140px;">
          <div style="font-size:28px;color:#fff;font-weight:600;">MicroRF</div>
          <div style="font-size:16px;color:#aaa;margin-top:5px;">Micro needle RF handpiece</div>
        </div>
      </div>
      <div class="settings-card card-lang" style="position:relative;width:100%;height:120px;display:flex;align-items:center;padding:0 30px;background:url('img/bg_set.png') no-repeat left center;background-size:120px 120px;cursor:pointer;border:none;" onclick="showToast('Artist selected')">
        <div style="margin-left:140px;">
          <div style="font-size:28px;color:#fff;font-weight:600;">Artist</div>
          <div style="font-size:16px;color:#aaa;margin-top:5px;">Artist RF handpiece</div>
        </div>
      </div>
      <div class="settings-card card-lang" style="position:relative;width:100%;height:120px;display:flex;align-items:center;padding:0 30px;background:url('img/bg_set.png') no-repeat left center;background-size:120px 120px;cursor:pointer;border:none;" onclick="showToast('Pure+ selected')">
        <div style="margin-left:140px;">
          <div style="font-size:28px;color:#fff;font-weight:600;">Pure+</div>
          <div style="font-size:16px;color:#aaa;margin-top:5px;">Pure+ RF handpiece</div>
        </div>
      </div>
    </div>

    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
