<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Anti-counterfeit</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen eng-screen">
    <div class="eng-header">
      <a href="set_activity.html" style="display:flex;align-items:center;text-decoration:none;">
        <img src="img/ic_back.png" alt="Back" width="45" height="45" style="cursor:pointer;">
        <span class="eng-title">Authorization</span>
      </a>
    </div>
    <div class="eng-content">
      <div class="eng-info-row"><span>Startup Security Module</span><span style="color:#5bae00;">Connected</span></div>
      <div class="eng-info-row"><span>Authorization Card</span><span id="cardStatus">Not detected</span></div>
      <div class="eng-info-row"><span>Card Remaining</span><span id="cardRemain">N/A</span></div>
      <div class="eng-info-row"><span>Device Time</span><span id="deviceTime">2024-01-01 00:00:00</span></div>
      <div class="eng-info-row"><span>Module Version</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>Configuration</span><span>On</span></div>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button onclick="showToast('Card detected')" style="padding:10px 25px;background:#10ae27;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Read Card</button>
        <button onclick="showToast('Activation success')" style="padding:10px 25px;background:#5bae00;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Activate</button>
        <button onclick="showToast('Maintenance mode toggled')" style="padding:10px 25px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Maintenance Mode</button>
      </div>
    </div>
    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
