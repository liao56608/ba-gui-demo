<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Version</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen eng-screen">
    <div class="eng-header">
      <a href="set_activity.html" style="display:flex;align-items:center;text-decoration:none;">
        <img src="img/ic_back.png" alt="Back" width="45" height="45" style="cursor:pointer;">
        <span class="eng-title">Version / Upgrade</span>
      </a>
    </div>
    <div class="eng-content">
      <div class="eng-info-row"><span>System Release Version</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>01 Main Control Board Firmware</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>02 Power Board Firmware</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>03 InterFace File</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>04 Handpiece Firmware</span><span>v1.0.0</span></div>
      <div class="eng-info-row"><span>08 Fill Board Firmware</span><span>v1.0.0</span></div>
      <div style="margin-top:20px;">
        <div style="font-size:18px;color:#333;margin-bottom:10px;font-weight:600;">Upgrade Options</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button onclick="showToast('Local upgrade started')" style="padding:12px 20px;background:#10ae27;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;text-align:left;">Local Upgrade</button>
          <button onclick="showToast('Remote upgrade started')" style="padding:12px 20px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;text-align:left;">Remote Upgrade</button>
          <button onclick="showToast('OTA upgrade started')" style="padding:12px 20px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;text-align:left;">OTA Upgrade</button>
          <button onclick="showToast('Default version restored')" style="padding:12px 20px;background:#5bae00;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;text-align:left;">Default Version</button>
        </div>
      </div>
    </div>
    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
</body>
</html>
