<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Network Test</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen eng-screen">
    <div class="eng-header">
      <a href="set_activity.html" style="display:flex;align-items:center;text-decoration:none;">
        <img src="img/ic_back.png" alt="Back" width="45" height="45" style="cursor:pointer;">
        <span class="eng-title">Network Test</span>
      </a>
    </div>
    <div class="eng-content">
      <div class="eng-info-row"><span>Status</span><span id="testStatus">Idle</span></div>
      <div class="eng-info-row"><span>Upload Speed</span><span id="uploadSpeed">- - Mbps</span></div>
      <div class="eng-info-row"><span>Download Speed</span><span id="downloadSpeed">- - Mbps</span></div>
      <div class="eng-info-row"><span>Latency</span><span id="latency">- - ms</span></div>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button id="btnStartTest" style="padding:10px 25px;background:#10ae27;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Start Test</button>
        <button id="btnStopTest" style="padding:10px 25px;background:#f41626;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px;">Stop Test</button>
      </div>
      <div id="testProgress" class="hidden" style="margin-top:20px;padding:15px;background:#fff;border:1px solid #ccc;border-radius:8px;">
        <div style="font-size:14px;color:#888;margin-bottom:8px;">Testing...</div>
        <div style="width:100%;height:20px;background:#e0e0e0;border-radius:10px;overflow:hidden;">
          <div id="testBar" style="height:100%;background:#10ae27;width:0%;transition:width 0.3s;"></div>
        </div>
      </div>
    </div>
    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
<script>
  let testing = false;
  document.getElementById('btnStartTest')?.addEventListener('click', () => {
    if (testing) return;
    testing = true;
    document.getElementById('testStatus').textContent = 'Testing';
    document.getElementById('testProgress').classList.remove('hidden');
    let p = 0;
    const t = setInterval(() => {
      p += 10;
      document.getElementById('testBar').style.width = p + '%';
      document.getElementById('uploadSpeed').textContent = (5 + Math.random()*10).toFixed(1) + ' Mbps';
      document.getElementById('downloadSpeed').textContent = (10 + Math.random()*20).toFixed(1) + ' Mbps';
      document.getElementById('latency').textContent = Math.floor(10 + Math.random()*30) + ' ms';
      if (p >= 100) {
        clearInterval(t);
        testing = false;
        document.getElementById('testStatus').textContent = 'Complete';
        showToast('Test complete');
      }
    }, 300);
  });
  document.getElementById('btnStopTest')?.addEventListener('click', () => {
    testing = false;
    document.getElementById('testStatus').textContent = 'Stopped';
  });
</script>
</body>
</html>
