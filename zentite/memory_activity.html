<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenTite — Memory</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device-frame">
  <div class="screen bg-setting">
    <!-- btn_back -->
    <a href="index.html" class="btn-back" id="backBtn" title="Back"></a>

    <!-- Title -->
    <div class="title-bar">
      <span class="text-cyan-title" id="memTitle">Saved Profiles</span>
    </div>

    <!-- Memory grid: 3x3, starting at approximately top=170, left=66 -->
    <!-- Guidelines: end=666dp, 416dp, 168dp → rows at 168, 416, 666 -->
    <div class="memory-grid" id="memGrid" style="top:168px;left:66px;">
      <!-- Cards populated by JS -->
    </div>
    <div id="memEmpty" style="position:absolute;top:400px;left:0;right:0;text-align:center;color:#888;font-size:20px;">
      No saved profiles. Tap an add card to create one.
    </div>

    <!-- Bottom controls -->
    <!-- btnCancel (invisible) -->
    <button id="btnCancel" class="hidden" style="position:absolute;bottom:50px;left:100px;width:135px;height:78px;background:url('img/bg_memory_confirm.png') no-repeat center;background-size:contain;border:none;color:#fff;font-size:20px;cursor:pointer;">Cancel</button>
    <!-- btnTreat -->
    <button id="btnTreat" style="position:absolute;bottom:50px;right:100px;width:135px;height:78px;background:url('img/bg_memory_treat.png') no-repeat center;background-size:contain;border:none;color:#fff;font-size:20px;cursor:pointer;">Treat</button>
    <!-- tvPrompt -->
    <div style="position:absolute;bottom:140px;left:0;right:0;text-align:center;color:#aaa;font-size:16px;">Select a saved profile. Long press the profile to edit.</div>

    <div class="proto-hint">Demo GUI; actual layout may vary. · <a href="index.html">Home</a></div>
  </div>
</div>
<script src="js/fit.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || 'artist';
  const srcNames = { artist: 'Artist', microrf: 'MicroRF', pureplus: 'Pure+' };
  const backHref = src + '_activity.html';
  document.getElementById('backBtn').href = backHref;
  document.getElementById('memTitle').textContent = (srcNames[src] || 'Saved') + ' — Saved Profiles';

  const grid = document.getElementById('memGrid');
  const emptyEl = document.getElementById('memEmpty');
  const btnCancel = document.getElementById('btnCancel');
  const btnTreat = document.getElementById('btnTreat');
  let selectedId = null;

  function getFieldsForSrc() {
    if (src === 'pureplus') return [
      { key: 'power', label: 'Power', unit: 'W', step: 1 },
      { key: 'time', label: 'Time', unit: 'min', step: 1 },
      { key: 'temp', label: 'Temp', unit: '°C', step: 0.5 }
    ];
    return [
      { key: 'power', label: 'Power', unit: 'W', step: 1 },
      { key: 'time', label: 'Time', unit: 'min', step: 1 },
      { key: 'depth', label: 'Depth', unit: 'mm', step: 0.1 }
    ];
  }

  function openEditProfileDialog(m, onSave) {
    const fields = getFieldsForSrc();
    let body = '<div style="display:flex;flex-direction:column;gap:12px;">';
    body += `<label style="color:#aaa;font-size:14px;">Name</label>`;
    body += `<input type="text" id="editName" class="modal-input" value="${m.name}" style="margin-bottom:8px;">`;
    fields.forEach(f => {
      const v = (m[f.key] !== undefined) ? m[f.key] : 0;
      body += `<div style="display:flex;align-items:center;gap:10px;">`;
      body += `<label style="color:#aaa;font-size:14px;width:70px;">${f.label}</label>`;
      body += `<input type="number" id="edit_${f.key}" class="modal-input" value="${v}" step="${f.step}" style="flex:1;">`;
      body += `<span style="color:#888;font-size:14px;width:40px;">${f.unit}</span>`;
      body += `</div>`;
    });
    body += '</div>';
    openModal('Edit Profile', body, {
      okText: 'Save',
      onOk: () => {
        const name = document.getElementById('editName').value.trim() || m.name;
        const updates = { name };
        fields.forEach(f => {
          const val = document.getElementById('edit_' + f.key).value;
          updates[f.key] = f.step < 1 ? parseFloat(val) : parseInt(val);
        });
        onSave(updates);
        closeModal();
      }
    });
  }

  function render() {
    const list = MemoryStore.list(src);
    grid.innerHTML = '';
    selectedId = null;
    btnCancel.classList.add('hidden');
    if (!list.length) {
      emptyEl.classList.remove('hidden');
      const addCard = document.createElement('div');
      addCard.className = 'memory-card add';
      addCard.title = 'Add new profile';
      addCard.addEventListener('click', () => {
        openMemoryNameDialog((name) => {
          MemoryStore.add(src, { name, power: 0, time: 0, depth: 0, temp: 40 });
          render();
          closeModal();
        });
      });
      grid.appendChild(addCard);
      return;
    }
    emptyEl.classList.add('hidden');
    list.forEach(m => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      const fields = getFieldsForSrc();
      card.innerHTML = `
        <div class="mem-title">${m.name}</div>
        ${fields.map(f => `<div class="mem-row"><span>${f.label}</span><span>${m[f.key] !== undefined ? m[f.key] : '-'}${f.unit}</span></div>`).join('')}
        <button class="mem-delete" title="Delete profile">×</button>
      `;
      const delBtn = card.querySelector('.mem-delete');
      delBtn.style.display = 'block';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        confirmDialog('Delete Profile', 'Delete profile "' + m.name + '"?', () => {
          MemoryStore.delete(src, m.id);
          render();
          showToast('Profile deleted');
        });
      });
      card.addEventListener('click', () => {
        document.querySelectorAll('.memory-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedId = m.id;
        btnCancel.classList.remove('hidden');
        showToast('Profile selected: ' + m.name);
      });
      let longPressTimer;
      card.addEventListener('mousedown', () => {
        longPressTimer = setTimeout(() => {
          openEditProfileDialog(m, (updates) => {
            MemoryStore.update(src, m.id, updates);
            render();
            showToast('Profile updated');
          });
        }, 600);
      });
      card.addEventListener('mouseup', () => clearTimeout(longPressTimer));
      card.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
      card.addEventListener('touchstart', () => {
        longPressTimer = setTimeout(() => {
          openEditProfileDialog(m, (updates) => {
            MemoryStore.update(src, m.id, updates);
            render();
            showToast('Profile updated');
          });
        }, 600);
      });
      card.addEventListener('touchend', () => clearTimeout(longPressTimer));
      grid.appendChild(card);
    });
    const addCard = document.createElement('div');
    addCard.className = 'memory-card add';
    addCard.title = 'Add new profile';
    addCard.addEventListener('click', () => {
      openMemoryNameDialog((name) => {
        MemoryStore.add(src, { name, power: 0, time: 0, depth: 0, temp: 40 });
        render();
        closeModal();
      });
    });
    grid.appendChild(addCard);
  }

  btnCancel.addEventListener('click', () => {
    selectedId = null;
    document.querySelectorAll('.memory-card').forEach(c => c.classList.remove('selected'));
    btnCancel.classList.add('hidden');
  });

  btnTreat.addEventListener('click', () => {
    if (!selectedId) {
      showToast('Please select a profile first');
      return;
    }
    location.href = backHref;
  });

  render();
</script>
</body>
</html>
